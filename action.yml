name: Sinistral IaC Scanner
description: Scan Infrastructure as Code with Sinistral policies
branding:
  icon: shield
  color: blue

inputs:
  iac_directories:
    required: true
    description: >
      Path(s) from the root of your repo to your IaC folder(s).
      Supports multiple directories separated by newlines.
  recurse:
    required: false
    description: Recursively scan all subdirectories containing Terraform files
    default: 'false'
  sinistral_api_url:
    required: true
    description: Base URL of your Sinistral API (e.g. https://api.sinistral.example.com)
  sinistral_auth_url:
    required: true
    description: Auth URL for your Sinistral instance (e.g. https://auth.console.example.com)
  sinistral_project_client_id:
    required: true
    description: OAuth2 client ID for your Sinistral project
  sinistral_project_client_secret:
    required: true
    description: OAuth2 client secret for your Sinistral project
  sinistral_project:
    required: true
    description: Sinistral project name to scan against
  sinistral_cli_version:
    required: false
    description: >
      sinistral-cli version to use. Accepts any git ref (branch, tag, SHA) from
      https://github.com/stacklet/sinistral-cli.
    default: '8552c68f72b9df5bb4985f722fec4063ebb35218' # v0.5.36
  post_pr_comment:
    required: false
    description: Whether to post scan results as a PR comment.
    default: 'true'
  skip_unchanged:
    required: false
    description: >
      Skip the scan (and toolchain setup) when the triggering push/PR changed no
      Terraform files (.tf/.tf.json/.tfvars/.tfvars.json) under `iac_directories`.
      Fails open: if the changed files can't be determined, the scan runs. Set to
      'false' to always scan.
    default: 'true'

runs:
  using: composite
  steps:
    # Fast pre-gate, before any toolchain setup: if nothing under the scanned
    # directories changed, every step below is skipped and the job succeeds
    # without paying for uv/Python install or the scan. Runs on the runner's
    # system python3 (stdlib only). Fails open (scans) on any uncertainty, and
    # always emits should_scan=true when skip_unchanged is off.
    - name: Detect IaC changes
      id: changes
      shell: bash
      env:
        SKIP_UNCHANGED: ${{ inputs.skip_unchanged }}
        IAC_DIRECTORIES: ${{ inputs.iac_directories }}
        GITHUB_TOKEN: ${{ github.token }}
        BASE_SHA: ${{ github.event_name == 'push' && github.event.before || github.event.pull_request.base.sha }}
        HEAD_SHA: ${{ github.event_name == 'push' && github.sha || github.event.pull_request.head.sha }}
      run: python3 "${{ github.action_path }}/scripts/detect_iac_changes.py"

    - name: Install uv
      if: steps.changes.outputs.should_scan == 'true'
      uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      with:
        enable-cache: true

    - name: Install Python
      if: steps.changes.outputs.should_scan == 'true'
      shell: bash
      run: uv python install 3.12

    - name: Configure Sinistral and Scan
      id: sinistral-run
      if: steps.changes.outputs.should_scan == 'true'
      shell: bash
      env:
        SINISTRAL_API_URL: ${{ inputs.sinistral_api_url }}
        SINISTRAL_AUTH_URL: ${{ inputs.sinistral_auth_url }}
        SINISTRAL_PROJECT_CLIENT_ID: ${{ inputs.sinistral_project_client_id }}
        SINISTRAL_PROJECT_CLIENT_SECRET: ${{ inputs.sinistral_project_client_secret }}
        SINISTRAL_CLI_VERSION: ${{ inputs.sinistral_cli_version }}
        SINISTRAL_PROJECT: ${{ inputs.sinistral_project }}
        IAC_DIRECTORIES: ${{ inputs.iac_directories }}
        RECURSE: ${{ inputs.recurse }}
      run: |
        missing=()
        for var in SINISTRAL_API_URL SINISTRAL_AUTH_URL SINISTRAL_PROJECT_CLIENT_ID SINISTRAL_PROJECT_CLIENT_SECRET SINISTRAL_PROJECT IAC_DIRECTORIES; do
          if [ -z "${!var}" ]; then
            missing+=("$var")
          fi
        done
        if [ ${#missing[@]} -gt 0 ]; then
          echo "::error::sinistral-action: the following required inputs are empty: ${missing[*]}"
          echo "::error::If this is a Dependabot run, confirm the corresponding secrets are configured under Settings -> Secrets and variables -> Dependabot (Actions secrets are not available to Dependabot runs)."
          exit 1
        fi

        uvx --from "git+https://github.com/stacklet/sinistral-cli@${SINISTRAL_CLI_VERSION}" \
          sinistral login

        RECURSE_FLAG=""
        if [ "${RECURSE}" = "true" ]; then
          RECURSE_FLAG="--recurse"
        fi

        # shellcheck disable=SC2086 — RECURSE_FLAG is intentionally unquoted so it
        # vanishes when empty rather than passing an empty-string argument.
        uv run --no-project \
          python "${{ github.action_path }}/scripts/run_sinistral_scans.py" \
          --iac-directories "${IAC_DIRECTORIES}" \
          --project "${SINISTRAL_PROJECT}" \
          --cli-version "${SINISTRAL_CLI_VERSION}" \
          ${RECURSE_FLAG} \
          --github-output "$GITHUB_OUTPUT"

    # Runs whether or not the scan ran: on a scanned run we post/update results
    # below; on a skipped run we use the found id to clear a stale comment.
    - name: Find Comment
      if: "!cancelled() && github.event_name == 'pull_request' && inputs.post_pr_comment == 'true'"
      uses: peter-evans/find-comment@b30e6a3c0ed37e7c023ccd3f1db5c6c0b0c23aad # v4.0.0
      id: fc
      with:
        issue-number: ${{ github.event.pull_request.number }}
        comment-author: "github-actions[bot]"
        body-includes: "<!-- sinistral results -->"

    - name: Create or update comment
      if: "!cancelled() && steps.changes.outputs.should_scan == 'true' && github.event_name == 'pull_request' && inputs.post_pr_comment == 'true'"
      uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9 # v5.0.0
      with:
        comment-id: ${{ steps.fc.outputs.comment-id }}
        issue-number: ${{ github.event.pull_request.number }}
        body: |
          <!-- sinistral results -->
          # Sinistral Results: [${{ steps.sinistral-run.outputs.OVERALL_STATUS }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

          ${{ steps.sinistral-run.outputs.SINISTRAL_RESULTS }}
        edit-mode: replace

    # When the scan is skipped but a previous run left a results comment, replace
    # its body so a stale (possibly failing) comment can't contradict the green
    # status. Only updates an existing comment — comment-id is required non-empty,
    # so this never creates a comment on PRs that never had one.
    - name: Clear stale comment on skipped run
      if: "!cancelled() && steps.changes.outputs.should_scan == 'false' && github.event_name == 'pull_request' && inputs.post_pr_comment == 'true' && steps.fc.outputs.comment-id != ''"
      uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9 # v5.0.0
      with:
        comment-id: ${{ steps.fc.outputs.comment-id }}
        body: |
          <!-- sinistral results -->
          # Sinistral Results: ⏭️ Skipped — no Terraform changes

          No `.tf`/`.tfvars` changes under the scanned directories in this
          revision, so the scan was skipped. Earlier results no longer apply.
        edit-mode: replace

    # Gated on should_scan: when the scan is skipped, EXIT_CODE is unset and the
    # `${EXIT_CODE:-1}` default would otherwise fail an unchanged-IaC run.
    - name: Exit with Code
      if: "!cancelled() && steps.changes.outputs.should_scan == 'true'"
      shell: bash
      env:
        EXIT_CODE: ${{ steps.sinistral-run.outputs.EXIT_CODE }}
      run: exit "${EXIT_CODE:-1}"
